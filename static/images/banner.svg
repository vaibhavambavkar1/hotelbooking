<!-- Save as: static/img/hotel_banner_dark.svg -->
<svg width="1600" height="420" viewBox="0 0 1600 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Hotel Paradise — Luxury Stay</title>
  <desc id="desc">Dark luxury banner with gold accent, skyline and palm silhouette</desc>

  <defs>
    <linearGradient id="g_bg" x1="0" x2="1">
      <stop offset="0" stop-color="#0b1020"></stop>
      <stop offset="1" stop-color="#151827"></stop>
    </linearGradient>

    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0" stop-color="#f5d07a"></stop>
      <stop offset="1" stop-color="#c99d36"></stop>
    </linearGradient>

    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1600" height="420" fill="url(#g_bg)"></rect>

  <!-- subtle gold glow -->
  <ellipse cx="320" cy="120" rx="420" ry="160" fill="url(#gold)" opacity="0.06" filter="url(#soft)"></ellipse>

  <!-- sun / accent -->
  <circle cx="300" cy="120" r="46" fill="url(#gold)" opacity="0.95"></circle>

  <!-- skyline (simple luxury building silhouettes) -->
  <g fill="#0f1724" opacity="0.95" transform="translate(720,120)">
    <rect x="-520" y="60" width="60" height="240" rx="6" fill="#0e1420"></rect>
    <rect x="-440" y="40" width="90" height="260" rx="6" fill="#131826"></rect>
    <rect x="-320" y="20" width="130" height="280" rx="6" fill="#0e141b"></rect>
    <rect x="-160" y="0" width="90" height="300" rx="6" fill="#111520"></rect>
    <rect x="-40" y="50" width="120" height="250" rx="6" fill="#121624"></rect>
    <rect x="120" y="30" width="160" height="270" rx="6" fill="#0f1520"></rect>
    <!-- windows (gold) -->
    <g fill="url(#gold)" opacity="0.9">
      <rect x="-310" y="40" width="10" height="16" rx="2"></rect>
      <rect x="-295" y="40" width="10" height="16" rx="2"></rect>
      <rect x="-280" y="40" width="10" height="16" rx="2"></rect>
      <!-- small repeated pattern across buildings -->
      <g transform="translate(-440,60)">
        <rect x="8" y="12" width="8" height="10" rx="1"></rect>
        <rect x="28" y="12" width="8" height="10" rx="1"></rect>
        <rect x="8" y="34" width="8" height="10" rx="1"></rect>
        <rect x="28" y="34" width="8" height="10" rx="1"></rect>
      </g>
    </g>
  </g>

  <!-- decorative palm and shore on left -->
  <g transform="translate(70,220)" fill="#0c1118" opacity="0.98">
    <ellipse cx="80" cy="110" rx="200" ry="40" fill="#0c1118" opacity="0.6"></ellipse>
    <path d="M60 80 C40 50, 120 40, 100 10" stroke="#0c1118" stroke-width="6" fill="none" stroke-linecap="round"></path>
    <path d="M85 60 C140 30, 160 90, 115 80" fill="#10202b" transform="translate(-20,-20)"></path>
    <path d="M72 40 C30 0, 60 -20, 90 10" fill="url(#gold)" opacity="0.14"></path>
  </g>

  <!-- foreground: elegant title and CTA -->
  <g transform="translate(60,60)">
    <text x="360" y="120" font-family="Georgia, 'Times New Roman', serif" font-size="48" fill="url(#gold)" font-weight="700" letter-spacing="1">
      Hotel Paradise
    </text>

    <text x="360" y="160" font-family="Inter, Arial, sans-serif" font-size="18" fill="#cbd5e1" opacity="0.95">
      Experience luxury, comfort &amp; bespoke hospitality — book your stay today.
    </text>

    <!-- decorative divider -->
    <rect x="360" y="175" width="260" height="2" fill="url(#gold)" opacity="0.9" rx="1"></rect>

    <!-- CTA simulated button (purely visual in SVG) -->
    <a href="#" transform="translate(0,0)" aria-label="Book Now">
      <g transform="translate(360,195)">
        <rect x="0" y="0" rx="26" width="220" height="46" fill="#111218" stroke="url(#gold)" stroke-width="1.6"></rect>
        <text x="110" y="30" font-family="Inter, Arial, sans-serif" font-size="16" fill="url(#gold)" font-weight="600" text-anchor="middle">Book Your Stay</text>
      </g>
    </a>
  </g>

  <!-- subtle stars / particles -->
  <g fill="#fdf6e3" opacity="0.6">
    <circle cx="480" cy="40" r="1.8"></circle>
    <circle cx="520" cy="28" r="1.2"></circle>
    <circle cx="560" cy="60" r="1.4"></circle>
    <circle cx="620" cy="18" r="1.1"></circle>
  </g>
</svg>
