version: "3.9"

services:
  db:
    image: postgres:16
    container_name: hotelbooking_db
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data   # named volume
    ports:
      - "5432:5432"   # optional (remove in prod if not needed)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always

  web:
    container_name: hotelbooking_web
    build: .
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: always

volumes:
  postgres_data:   # <-- this declares the named volume
