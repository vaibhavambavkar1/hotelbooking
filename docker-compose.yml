version: "3.9"

services:
  db:
    image: mysql:8.0
    container_name: hotelbooking_db
    command: --default-authentication-plugin=mysql_native_password
    env_file:
      - .env
    environment:
      # Map the custom variable names from .env to the ones expected by the MySQL image
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      # Do not set MYSQL_USER to root as it's not allowed in standard MySQL image
      # MYSQL_USER: ${DB_USER}
      # MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always

  web:
    container_name: hotelbooking_web
    build: .
    env_file:
      - .env
    environment:
      # Override host when running inside Docker to point to the 'db' service
      DB_HOST: db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: always

volumes:
  mysql_data:
