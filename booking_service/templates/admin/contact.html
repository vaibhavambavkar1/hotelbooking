{% block content %}
<section id="contact" class="bg-base-200 py-16 px-6">
  <div class="max-w-5xl mx-auto">

    <!-- Heading -->
    <div class="text-center mb-12">
      <h2 class="text-4xl font-bold">Contact Us</h2>
      <p class="text-gray-500 mt-2">We’d love to hear from you! Please reach out with any questions.</p>
    </div>

    <!-- Main grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-10">

      <!-- Contact Form -->
      <div class="card bg-base-100 shadow-xl p-8">
        <h3 class="text-2xl font-semibold mb-4">Send a Message</h3>

        <form method="POST">
          {% csrf_token %}
          <div class="form-control mb-4">
            <label class="label"><span class="label-text">Name   </span></label>
            <input type="text" class="input input-bordered" placeholder="Enter your name" name="name">
          </div>

          <div class="form-control mb-4">
            <label class="label"><span class="label-text">Email  </span></label>
            <input type="email" class="input input-bordered" placeholder="Enter your email" name="email">
          </div>
            
            <div class="form-control mb-4">
            <label class="label"><span class="label-text">Mobile </span></label>
            <input type="mobile" class="input input-bordered" placeholder="Enter your Mobile Number" name="mobile">
          </div>

          <div class="form-control mb-4">
            <label class="label"><span class="label-text">Message</span></label>
            <textarea class="textarea textarea-bordered h-32" placeholder="Your message..." name="message"></textarea>
          </div>

          <button class="btn btn-primary w-full">Send Message</button>
        </form>
      </div>

      <!-- Contact Details -->
      <div class="space-y-6">

        <div class="card bg-base-100 shadow-xl p-8">
          <h3 class="text-2xl font-semibold mb-4">Contact Details</h3>

          <p class="flex items-center gap-3">
            📍 <span>Hotel Street, City, Country</span>
          </p>

          <p class="flex items-center gap-3 mt-3">
            📞 <span>+91 9876543210</span>
          </p>

          <p class="flex items-center gap-3 mt-3">
            ✉️ <span>support@hotel.com</span>
          </p>
        </div>

        <!-- Map Embed (Optional) -->
        <div class="rounded-xl overflow-hidden shadow">
          <iframe
            width="100%"
            height="250"
            src="https://maps.google.com/maps?q=Mumbai&t=&z=13&ie=UTF8&iwloc=&output=embed"
            allowfullscreen>
          </iframe>
        </div>

      </div>

    </div>

  </div>
</section>
{% endblock %}
